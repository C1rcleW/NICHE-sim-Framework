name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 ruff
        # 钉住版本：ruff 的默认规则集会随版本变化，浮动安装会让 CI 突然变红
        # （0.15 → 0.17 曾让本项目多出 179 项告警）。规则集本身也在
        # pyproject.toml 的 [tool.ruff.lint] select 中显式声明。
        run: python -m pip install --upgrade pip "ruff==0.17.0"
      - name: ruff
        run: ruff check family_abm tests tools experiments

  frontend:
    name: 前端行为与浏览器冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装（含 e2e 依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]"
      - name: 前端语法与行为测试
        run: |
          node --check family_abm/web/static/js/dashboard.js
          node tools/check_dashboard_behavior.js
      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium
      - name: 真实浏览器冒烟
        env:
          RUN_BROWSER_TESTS: "1"
          PYTHONUTF8: "1"
        run: python -m pytest tests/test_browser_smoke.py -q

  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含测试依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 运行测试
        run: python -m pytest tests/ -q

  test-windows:
    # Windows 覆盖路径处理与 Web 资源定位的平台差异。
    # 排除 packaging 标记：构建 wheel 与 pip --target 安装对运行环境敏感
    # （磁盘、杀软、路径长度），已由下面的 package job 在标准环境完整覆盖。
    # 单独成 job（而非矩阵的一行）是为了避免向 pytest 传空的 -m 参数——
    # 空串参数在 bash 与 PowerShell 下语义不同。
    name: 测试 (Python 3.12 / Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（含测试依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 运行测试（排除环境敏感的构建/安装测试）
        # -rf 打印失败摘要，--tb=long 保留完整回溯：Windows 上曾出现本地无法复现的
        # 失败，完整的失败定位信息是排查前提。PYTHONUTF8 避免中文输出被代码页转码。
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q -m "not packaging" -rf --tb=long

  package:
    name: 打包与安装冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build "ruff==0.17.0"
          python -m pip install -e ".[dev]"
          python -m build --wheel
      - name: 打包相关测试（构建 / 安装 / 元数据契约）
        # Windows job 排除了 packaging 标记，因此在这里完整跑一遍
        run: python -m pytest tests/ -q -m "packaging"
      - name: 干净环境安装并验证
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl httpx
          # 必须用 --import-only：不带参数时脚本会要求 target 目录并直接退出 2。
          # 同时必须从仓库外运行，否则 sys.path[0] 会让仓库源码冒充已安装副本。
          cd /tmp
          /tmp/clean/bin/python "$GITHUB_WORKSPACE/tools/verify_install.py" --import-only

  release:
    # 打 v* tag 时自动构建 wheel + sdist 并附加到对应的 GitHub Release。
    # 这样发布流程不依赖本机环境，"v0.2.0 的产物由 v0.2.0 的提交构建"也可追溯。
    # 正文不在此处设置：Release 标题与说明由仓库所有者在 GitHub 上填写，
    # 避免自动覆盖人工润色的发布说明。
    #
    # needs 是发布门禁：此前没有它，lint/测试/打包任一失败也会照样把产物发出去，
    # "已发布产物通过了 CI"这一前提就不成立。
    if: startsWith(github.ref, 'refs/tags/v')
    name: 发布产物（打 tag 时触发）
    needs: [lint, frontend, test, test-windows, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --upgrade pip build packaging
          python -m build
      - name: 校验产物版本号与 tag 一致
        # 使用 PEP 440 解析版本，避免 0.1.1 误匹配 0.1.10，并正确处理 rc 标签。
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.version import InvalidVersion, Version

          tag = os.environ["GITHUB_REF_NAME"]
          assert tag.startswith("v"), f"release tag 必须以 v 开头：{tag}"
          try:
              expected = Version(tag[1:])
          except InvalidVersion as exc:
              raise SystemExit(f"tag 不是合法 PEP 440 版本：{tag}") from exc

          files = sorted(Path("dist").iterdir())
          assert files, "dist/ 为空"
          for path in files:
              name = path.name
              assert name.startswith("family_abm-"), f"非本项目产物：{name}"
              tail = name[len("family_abm-"):]
              if name.endswith(".tar.gz"):
                  artifact_version = tail[:-len(".tar.gz")]
              elif name.endswith(".whl"):
                  artifact_version = tail.split("-", 1)[0]
              else:
                  raise SystemExit(f"未知产物类型：{name}")
              try:
                  parsed = Version(artifact_version)
              except InvalidVersion as exc:
                  raise SystemExit(f"产物版本无法解析：{name}") from exc
              if parsed != expected:
                  raise SystemExit(
                      f"产物 {name} 的版本 {parsed} 与 tag {expected} 不一致"
                  )
              print(f"[OK] {name}: {parsed}")
          PY
      - name: 附到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release upload 在 Release 不存在时会失败，因此先确保它存在。
          # 用 --generate-notes 自动生成说明：仓库所有者可在 GitHub 上编辑改写，
          # 既让流程无人值守可用，也不妨碍人工润色发布说明。
          # 带预发布后缀的 tag（如 v0.2.0-rc.1）自动标记为 pre-release。
          EXTRA=""
          case "$GITHUB_REF_NAME" in *-*) EXTRA="--prerelease" ;; esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，改为追加产物"
          else
            echo "Release $GITHUB_REF_NAME 不存在，创建并自动生成说明 ${EXTRA}"
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes $EXTRA
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
